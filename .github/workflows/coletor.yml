name: Testar Coletor O Bicho Certo

on:
  workflow_dispatch:
  schedule:
     - cron: '0*/3 * * *'

permissions:
  contents: write

jobs:
  testar-coletor:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar bibliotecas
        run: pip install -r requirements.txt

      - name: Executar coletor
        run: python coletor.py

      - name: Conferir resultados
        run: |
          python -c "import json; dados=json.load(open('data/results.json')); print('Total de registros:',len(dados))"

      - name: Mostrar resultados coletados
        run: |
          python -m json.tool data/results.json
      - name: Salvar resultados no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar resultados coletados"
            git push
          fi
