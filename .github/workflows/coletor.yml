name: Testar Coletor O Bicho Certo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar-coletor:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar bibliotecas
        run: pip install -r requirements.txt

      - name: Executar coletor
        run: python coletor.py

      - name: Conferir resultados
        run: |
          python -c "import json; dados=json.load(open('data/results.json')); print('Total de registros:',len(dados))"

      - name: Mostrar resultados coletados
        run: |
          python -m json.tool data/results.json
